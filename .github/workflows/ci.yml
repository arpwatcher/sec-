name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # every mock: 90 items, blueprint weights, answer keys, PBQ structure, no repeated stems
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # the exam in a real browser: timer, flag, strike, PBQs, review screen, resume, score report, phone layout
      - run: npm run smoke
      # the same checks on the site exactly as it is deployed
      - run: node tools/build-site.mjs site "${GITHUB_SHA::7}" && SITE_ROOT=site npm run smoke

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    # the site is served from the gh-pages branch: each green push to main replaces it
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          node tools/build-site.mjs site "${GITHUB_SHA::7}"
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site build of main ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
